<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Cercle: Simulació de Forces G i Velocitat</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #1a1a1a; color: white; margin: 0; padding: 20px; }
        .wrapper { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
        .canvas-card { background: #222; padding: 15px; border-radius: 12px; border: 2px solid #444; }
        
        #graph-container { 
            width: 550px; 
            height: 550px; 
            background: #0a0a0a; 
            margin: 10px auto; 
            border: 2px solid #555; 
            border-radius: 8px; 
        }
        
        .stats { font-size: 1.15em; color: #00ff00; font-family: monospace; background: #000; padding: 12px 20px; display: inline-block; border-radius: 5px; margin-bottom: 15px; border: 1px solid #444; }
        h2 { margin: 5px 0; font-size: 1.2em; color: #ddd; }
    </style>
</head>
<body>

    <h1>Looping Circular — Velocitat i Forces G</h1>
    <div class="stats" id="marcador">v₀: 16.00 m/s | v: 0.00 m/s | Forces G: 0.00 g | G Màxima: 0.00 g</div>

    <div class="wrapper">
        <div class="canvas-card">
            <h2>Trajectòria Circular x² + y² = 25</h2>
            <div id="graph-container"></div>
        </div>
    </div>

    <script>
    var Graph = (function() {
        function G(id, titleY, titleX) {
            this.el = document.getElementById(id);
            this.canvas = document.createElement('canvas');
            this.el.appendChild(this.canvas);
            this.ctx = this.canvas.getContext('2d');
            this.series = [];
            this.titleY = titleY || "";
            this.titleX = titleX || "";
            this.minX = -7; this.maxX = 7;
            this.minY = -7; this.maxY = 7;
            this.resize();
        }
        G.prototype.resize = function() {
            this.canvas.width = this.el.clientWidth;
            this.canvas.height = this.el.clientHeight;
        };
        G.prototype.getXAxis = function() { 
            var self = this;
            return { setBoundaries: function(s, e) { self.minX = s; self.maxX = e; } }; 
        };
        G.prototype.getYAxis = function() { 
            var self = this;
            return { setBoundaries: function(s, e) { self.minY = s; self.maxY = e; } }; 
        };
        G.prototype.newSerie = function(name, opt) {
            var s = { name: name, opt: opt, data: [], setData: function(d) { this.data = d; } };
            this.series.push(s);
            return s;
        };
        G.prototype.draw = function() {
            var ctx = this.ctx;
            var w = this.canvas.width;
            var h = this.canvas.height;
            var margin = 45;

            ctx.clearRect(0, 0, w, h);

            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = margin; x < w; x += 50) { ctx.moveTo(x, 0); ctx.lineTo(x, h - margin); }
            for (let y = 0; y < h - margin; y += 50) { ctx.moveTo(margin, y); ctx.lineTo(w, h - margin); }
            ctx.stroke();

            ctx.strokeStyle = '#666';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(margin, 0); ctx.lineTo(margin, h - margin);
            ctx.moveTo(margin, h - margin); ctx.lineTo(w, h - margin);
            ctx.stroke();

            ctx.fillStyle = '#aaa';
            ctx.font = '12px sans-serif';
            ctx.fillText(this.titleY, margin + 5, 15);
            ctx.fillText(this.titleX, w - 60, h - margin - 8);

            if (this.minX !== undefined && this.maxX !== undefined) {
                ctx.fillText(this.minX.toFixed(1), margin, h - margin + 15);
                ctx.fillText(this.maxX.toFixed(1), w - 45, h - margin + 15);
            }

            if (this.minY === undefined || this.maxY === undefined) return;

            let rangeX = (this.maxX - this.minX) || 1;
            let rangeY = (this.maxY - this.minY) || 1;

            this.series.forEach(s => {
                if (s.data.length < 2) return;

                if (s.opt.type === 'scatter') {
                    ctx.fillStyle = s.opt.marker ? s.opt.marker.color : '#ff4444';
                    for (var i = 0; i < s.data.length; i += 2) {
                        var px = margin + ((s.data[i] - this.minX) / rangeX) * (w - margin - 15);
                        var py = (h - margin) - ((s.data[i+1] - this.minY) / rangeY) * (h - margin - 25);
                        ctx.beginPath();
                        ctx.arc(px, py, s.opt.marker.radius || 7, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else {
                    ctx.beginPath();
                    ctx.strokeStyle = s.opt.lineColor || '#00ff00';
                    ctx.lineWidth = s.opt.lineWidth || 2;
                    for (var i = 0; i < s.data.length; i += 2) {
                        var px = margin + ((s.data[i] - this.minX) / rangeX) * (w - margin - 15);
                        var py = (h - margin) - ((s.data[i+1] - this.minY) / rangeY) * (h - margin - 25);
                        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                    }
                    ctx.stroke();
                }
            });
        };
        return G;
    })();

window.onload = function() {
    const graph = new Graph("graph-container", "Posició Y (m)", "Posició X (m)");
    graph.getXAxis().setBoundaries(-7, 7);
    graph.getYAxis().setBoundaries(-7, 7);

    const RADI_TEORIC = 5.000000; 
    const centrex = 0.0, centrey = 0.0; 

    const via = graph.newSerie("via", { lineColor: '#4444ff', lineWidth: 2 });
    let dadesVia = [];
    for (let t = 0; t <= 2 * Math.PI + 0.01; t += 0.005) {
        dadesVia.push(centrex + RADI_TEORIC * Math.cos(t), centrey + RADI_TEORIC * Math.sin(t));
    }
    via.setData(dadesVia);

    const vagoneta = graph.newSerie("vagoneta", { type: 'scatter', marker: { color: '#ff4444', radius: 8 } });

    let x = 0.0; let y = -5.0; 
    let velocitatx = 16; let velocitaty = 0.0; 
    const v_inicial = Math.sqrt(velocitatx * velocitatx + velocitaty * velocitaty);
    const g = 9.81;

    const subSteps = 1002; 
    const augmentdetemps = 0.016 / subSteps; 

    let maxGAssegurada = 1.0;

    function animar() {
        let ax = 0, ay = 0;
        let an = 0;

        for (let s = 0; s < subSteps; s++) {
            let distCalculada = Math.sqrt(x * x + y * y);

            let vector_normal_unitari_x = x / distCalculada;
            let vector_normal_unitari_y = y / distCalculada;

            let v_sq = velocitatx * velocitatx + velocitaty * velocitaty;
            let g_component = -g * vector_normal_unitari_y;
            
            an = (v_sq / RADI_TEORIC) + g_component;

            ax = -an * vector_normal_unitari_x;
            ay = -an * vector_normal_unitari_y - g;

            velocitatx += ax * augmentdetemps;
            velocitaty += ay * augmentdetemps;

            x += velocitatx * augmentdetemps;
            y += velocitaty * augmentdetemps;
        }

        let v_sq_actual = velocitatx * velocitatx + velocitaty * velocitaty;
        let velocitatActual = Math.sqrt(v_sq_actual);
        let forcesG = an / g;

        if (forcesG > maxGAssegurada) {
            maxGAssegurada = forcesG;
        }

        marcador.innerText = `v₀: ${v_inicial.toFixed(2)} m/s | v: ${velocitatActual.toFixed(2)} m/s | Forces G: ${forcesG.toFixed(2)} g | G Màxima: ${maxGAssegurada.toFixed(2)} g`;
        
        vagoneta.setData([x, y]);
        graph.draw();

        requestAnimationFrame(animar);
    }
    animar();
}
    </script>
</body>
</html>
