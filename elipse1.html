<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Elipse</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #1a1a1a; color: white; margin: 0; padding: 20px; }
        #graph-container { width: 90vw; max-width: 600px; aspect-ratio:1; background: #ffffff; margin: 20px auto; border: 4px solid #555; border-radius: 12px; }
        .stats { font-size: 1.1em; color: #00ff00; font-family: monospace; background: #000; padding: 10px; display: inline-block; border-radius: 5px; }
        .llegenda { margin-top: 10px; font-weight: bold; }
        .llegenda span { margin: 0 8px; padding: 3px 8px; border-radius: 4px; color: #000; }
    </style>
</head>
<body>

    <h1>Looping El·líptic: Model d'Euler (10 Voltes)</h1>
    <div class="stats" id="marcador">v: 0 | Em: 0 J/kg | ΔE: 0 J/kg</div>
    <div id="graph-container"></div>
    <div class="llegenda">
        <span style="background: #00cc44;">unx, uny (Normal)</span>
        <span style="background: #ff4444; color: white;">ax (Acc. X)</span>
        <span style="background: #ff9900;">ay (Acc. Y)</span>
        <span style="background: #ffff00;">v (Velocitat)</span>
    </div>

    <script>
    /* MOTOR GRÀFIC ESTÀNDARD AMB SUPORT PER A FLETXES/VECTORS */
    var Graph = (function() {
        function G(id) {
            this.el = document.getElementById(id);
            this.canvas = document.createElement('canvas');
            this.el.appendChild(this.canvas);
            this.ctx = this.canvas.getContext('2d');
            this.series = [];
            this.vectors = [];
            this.resize();
        }
        G.prototype.resize = function() {
            this.canvas.width = this.el.clientWidth;
            this.canvas.height = this.el.clientHeight;
        };
        G.prototype.getXAxis = function() { return { setBoundaries: (s, e) => { this.minX = s; this.maxX = e; return { setLabel: () => {} } } }; };
        G.prototype.getYAxis = function() { return { setBoundaries: (s, e) => { this.minY = s; this.maxY = e; return { setLabel: () => {} } } }; };
        G.prototype.newSerie = function(name, opt) {
            var s = { name: name, opt: opt, data: [], setData: function(d) { this.data = d; } };
            this.series.push(s);
            return s;
        };
        
        G.prototype.addVector = function(x1, y1, x2, y2, color, label) {
            this.vectors.push({x1: x1, y1: y1, x2: x2, y2: y2, color: color, label: label});
        };
        
        G.prototype.clearVectors = function() {
            this.vectors = [];
        };

        G.prototype.toPixelX = function(x) {
            return (x - this.minX) / (this.maxX - this.minX) * this.canvas.width;
        };
        G.prototype.toPixelY = function(y) {
            return this.canvas.height - (y - this.minY) / (this.maxY - this.minY) * this.canvas.height;
        };

        G.prototype.draw = function() {
            var ctx = this.ctx;
            ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            
            // 1. Dibuixar la via i la vagoneta
            this.series.forEach(s => {
                ctx.beginPath();
                ctx.strokeStyle = s.opt.lineColor || 'black';
                ctx.lineWidth = s.opt.lineWidth || 2;
                ctx.fillStyle = s.opt.marker ? s.opt.marker.color : 'black';
                for (var i = 0; i < s.data.length; i += 2) {
                    var px = this.toPixelX(s.data[i]);
                    var py = this.toPixelY(s.data[i+1]);
                    if (s.opt.type === 'scatter') {
                        ctx.beginPath();
                        ctx.arc(px, py, s.opt.marker.radius || 10, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                    }
                }
                if (s.opt.type !== 'scatter') ctx.stroke();
            });

            // 2. Dibuixar tots els vectors de forces i velocitat
            this.vectors.forEach(v => {
                var px1 = this.toPixelX(v.x1);
                var py1 = this.toPixelY(v.y1);
                var px2 = this.toPixelX(v.x2);
                var py2 = this.toPixelY(v.y2);

                const headLength = 7;
                const angle = Math.atan2(py2 - py1, px2 - px1);

                ctx.strokeStyle = v.color;
                ctx.fillStyle = v.color;
                ctx.lineWidth = 2.5;

                ctx.beginPath();
                ctx.moveTo(px1, py1);
                ctx.lineTo(px2, py2);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(px2, py2);
                ctx.lineTo(px2 - headLength * Math.cos(angle - Math.PI / 6), py2 - headLength * Math.sin(angle - Math.PI / 6));
                ctx.lineTo(px2 - headLength * Math.cos(angle + Math.PI / 6), py2 - headLength * Math.sin(angle + Math.PI / 6));
                ctx.closePath();
                ctx.fill();

                if (v.label) {
                    ctx.font = "bold 12px monospace";
                    ctx.fillText(v.label, px2 + 4, py2 + 4);
                }
            });
        };
        return G;
    })();

    window.onload = function() {
        const graph = new Graph("graph-container");
        graph.getXAxis().setBoundaries(-6, 8);
        graph.getYAxis().setBoundaries(-7, 7);

        const rx = 3, ry = 4, centrex = 1, centrey = 0;

        const via = graph.newSerie("via", { lineColor: '#333', lineWidth: 4 });
        let dadesVia = [];
        for (let t = 0; t <= 2 * Math.PI + 0.1; t += 0.05) {
            dadesVia.push(centrex + rx * Math.sin(t), centrey + ry * Math.cos(t));
        }
        via.setData(dadesVia);

        const vagoneta = graph.newSerie("vagoneta", { type: 'scatter', marker: { color: '#ffffff', radius: 8 } });

        let x = centrex + rx; 
        let y = centrey; 
        let velocitatx = 0; 
        let velocitaty = 10; 
        const g = 9.81;
        
        const subSteps = 1000; 
        const augmentdetemps = 0.016 / subSteps; 

        // Càlcul d'energia mecànica inicial (Em = 0.5*v^2 + g*y)
        const E_mecanica_inicial = 0.5 * (velocitatx**2 + velocitaty**2) + g * y;

        let voltes = 0;
        let estatQuadrant = 0;

        function animar() {
            let R_debug = 0;
            let lastUnx = 0, lastUny = 0;
            let lastAx = 0, lastAy = 0;
            let lastVx = 0, lastVy = 0;
            let onTrack = true;

            // INTEGRACIÓ MITJANÇANT EL MODEL D'EULER
            for (let s = 0; s < subSteps; s++) {
                let relX = x - centrex;
                let relY = y - centrey;

                let t = Math.atan2(relX / rx, relY / ry);

                let dx = rx * Math.cos(t);
                let dy = -ry * Math.sin(t);
                let ddx = -rx * Math.sin(t);
                let ddy = -ry * Math.cos(t);
                
                let num = Math.pow(dx * dx + dy * dy, 1.5);
                let den = Math.abs(dx * ddy - dy * ddx);
                let R = num / den;
                R_debug = R;

                // Vector normal cap a fora
                let nx = relX / (rx * rx);
                let ny = relY / (ry * ry);
                let nMag = Math.sqrt(nx * nx + ny * ny);
                let unx = nx / nMag;
                let uny = ny / nMag;

                let v_sq = velocitatx * velocitatx + velocitaty * velocitaty;
                
                let g_n = -g * uny; 
                let N = (v_sq / R) + g_n;

                let ax = 0, ay = 0;
                if (N > 0) {
                    ax = -N * unx;
                    ay = -N * uny - g;
                    onTrack = true;
                } else {
                    ax = 0;
                    ay = -g;
                    onTrack = false;
                }

                lastUnx = unx;
                lastUny = uny;
                lastAx = ax;
                lastAy = ay;
                lastVx = velocitatx;
                lastVy = velocitaty;

                // 1. Actualització de la velocitat (Euler)
                velocitatx += ax * augmentdetemps;
                velocitaty += ay * augmentdetemps;

                // 2. Actualització de la posició (Euler)
                x += velocitatx * augmentdetemps;
                y += velocitaty * augmentdetemps;

                // Correcció de velocitat per mantenir la vagoneta a la via
                if (N > 0) {
                    let dot = velocitatx * unx + velocitaty * uny;
                    velocitatx -= dot * unx;
                    velocitaty -= dot * uny;
                }

                // Detecció de les 10 voltes completes
                if (estatQuadrant === 0 && relY > 2.0) {
                    estatQuadrant = 1;
                } else if (estatQuadrant === 1 && relY < -2.0 && velocitaty > 0) {
                    voltes++;
                    estatQuadrant = 0;
                }
            }

            let vel_mod = Math.sqrt(velocitatx**2 + velocitaty**2);
            let Em_actual = 0.5 * (vel_mod**2) + g * y;
            let deltaE = Math.abs(E_mecanica_inicial - Em_actual);

            marcador.innerText = `Voltes: ${voltes}/10 | v: ${vel_mod.toFixed(2)} m/s | Em: ${Em_actual.toFixed(2)} J/kg | ΔE: ${deltaE.toFixed(4)} J/kg`;
            vagoneta.setData([x, y]);

            graph.clearVectors();
            if (onTrack) {
                graph.addVector(x, y, x + lastUnx * 1.5, y + lastUny * 1.5, '#00cc44', 'ûn');
                graph.addVector(x, y, x + lastAx * 0.08, y, '#ff4444', 'ax');
                graph.addVector(x, y, x, y + lastAy * 0.08, '#ff9900', 'ay');
                graph.addVector(x, y, x + lastVx * 0.2, y + lastVy * 0.2, '#ffff00', 'v');
            }

            graph.draw();

            // Aturada a les 10 voltes
            if (voltes >= 10) {
                let difPercentual = (deltaE / Math.abs(E_mecanica_inicial)) * 100;
                marcador.innerHTML = `
                    <b style="color:#00ff00">10 VOLTES COMPLETADES (EULER)</b><br>
                    E_inicial: <b>${E_mecanica_inicial.toFixed(4)} J/kg</b> | E_final: <b>${Em_actual.toFixed(4)} J/kg</b><br>
                    Diferència d'Energia (ΔE): <b>${deltaE.toFixed(4)} J/kg</b> (${difPercentual.toFixed(2)} %)
                `;
                return;
            }
            
            requestAnimationFrame(animar);
        }
        animar(); 
    }
    </script>
</body>
</html>
