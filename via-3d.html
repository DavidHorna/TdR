<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulació 3D de Muntanya Russa</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 8px;
            pointer-events: none;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }
        p {
            margin: 3px 0;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="info">
        <h1>Simulació 3D</h1>
        <p>Arrossega amb el ratolí per rotar la càmera.</p>
        <p>Roda del ratolí per fer zoom.</p>
        <p id="velocitat">Velocitat: 0 m/s</p>
        <p id="alcada">Alçada: 0 m</p>
        <p id="g-actuals">Forces G actuals: 1.00 G</p>
        <p id="g-maximes">Forces G màximes: 1.00 G</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 30, 80);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        const gridHelper = new THREE.GridHelper(150, 60, 0x475569, 0x334155);
        gridHelper.position.y = -15;
        scene.add(gridHelper);

        const SCALE_XZ = 2.5; 
        const SCALE_Y = 1.5;  

        const basePoints = [
            new THREE.Vector3(0, 12, -20),
            new THREE.Vector3(15, 0, -10),
            new THREE.Vector3(20, -5, 10),
            new THREE.Vector3(0, -2, 20),
            new THREE.Vector3(-20, 8, 10),
            new THREE.Vector3(-10, -5, -10)
        ];

        const controlPoints = basePoints.map(p => new THREE.Vector3(
            p.x * SCALE_XZ,
            p.y * SCALE_Y,
            p.z * SCALE_XZ
        ));
        
        const trackCurve = new THREE.CatmullRomCurve3(controlPoints, true);

        const tubeGeometry = new THREE.TubeGeometry(trackCurve, 300, 0.4, 8, true);
        const tubeMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x64748b, 
            roughness: 0.3,
            metalness: 0.8 
        });
        const trackMesh = new THREE.Mesh(tubeGeometry, tubeMaterial);
        scene.add(trackMesh);

        const cartGeometry = new THREE.BoxGeometry(2, 1.2, 3);
        const cartMaterial = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.2 });
        const cart = new THREE.Mesh(cartGeometry, cartMaterial);
        scene.add(cart);

        let t = 0; 
        const gravity = 9.81;
        const maxAltitude = 12 * SCALE_Y; 
        const initialSpeed =20; 

        let maxGForce = 1.0; 
        let smoothedG = 1.0;

        const clock = new THREE.Clock();
        const trackLength = trackCurve.getLength();

        const speedText = document.getElementById("velocitat");
        const altText = document.getElementById("alcada");
        const gActualsText = document.getElementById("g-actuals");
        const gMaximesText = document.getElementById("g-maximes");

        function animate() {
            requestAnimationFrame(animate);

            const deltaTime = clock.getDelta(); 

            const currentPosition = trackCurve.getPointAt(t);
            
            const y = currentPosition.y;

            const speed = Math.sqrt((initialSpeed * initialSpeed) + (2 * gravity * (maxAltitude - y)));

            const tangent = trackCurve.getTangentAt(t).normalize();

            const tangentialAccMagnitude = -gravity * tangent.y;
            const tangentialAccVector = tangent.clone().multiplyScalar(tangentialAccMagnitude);

            const deltaS = 1.5; 
            const deltaT = deltaS / trackLength;

            let tAhead = (t + deltaT) % 1;
            let tBehind = (t - deltaT + 1) % 1;

            const tangentAhead = trackCurve.getTangentAt(tAhead).normalize();
            const tangentBehind = trackCurve.getTangentAt(tBehind).normalize();

            const curvatureVector = new THREE.Vector3()
                .subVectors(tangentAhead, tangentBehind)
                .divideScalar(2 * deltaS);

            const normalAccVector = curvatureVector.multiplyScalar(speed * speed);

            const totalCartAcc = tangentialAccVector.add(normalAccVector);
            const apparentAcc = new THREE.Vector3(
                totalCartAcc.x,
                totalCartAcc.y + gravity,
                totalCartAcc.z
            );

            const rawG = apparentAcc.length() / gravity;
            smoothedG = smoothedG * 0.85 + rawG * 0.15;

            if (smoothedG > maxGForce) {
                maxGForce = smoothedG;
            }

            speedText.innerText = `Velocitat: ${(speed * 3.6).toFixed(1)} km/h`;
            altText.innerText = `Alçada: ${y.toFixed(1)} m`;
            gActualsText.innerText = `Forces G actuals: ${smoothedG.toFixed(2)} G`;
            gMaximesText.innerText = `Forces G màximes: ${maxGForce.toFixed(2)} G`;

            t += (speed * deltaTime) / trackLength;
            if (t > 1) t %= 1;

            cart.position.copy(currentPosition);
            const lookTarget = currentPosition.clone().add(tangent);
            cart.lookAt(lookTarget);

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
