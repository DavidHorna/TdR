<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulació 3D de Muntanya Russa</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 8px;
            pointer-events: none;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }
        p {
            margin: 3px 0;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="info">
        <h1>Simulador 3D (Prova TdR)</h1>
        <p>Arrossega amb el ratolí per rotar la càmera.</p>
        <p>Roda del ratolí per fer zoom.</p>
        <p id="velocitat">Velocitat: 0 m/s</p>
        <p id="alcada">Alçada: 0 m</p>
    </div>

    <!-- Carreguem Three.js i OrbitControls des d'un CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. CONFIGURACIÓ DE LAESCENA, CÀMERA I RENDERER
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a); // Blau fosc de fons

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 20, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Controls de càmera interactius
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 2. IL·LUMINACIÓ
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // Afegim una quadrícula a terra com a referència espacial
        const gridHelper = new THREE.GridHelper(60, 60, 0x475569, 0x334155);
        gridHelper.position.y = -10;
        scene.add(gridHelper);

        // 3. DEFINICIÓ DE LA VIA (Corba paramètrica 3D)
        //punts clau (x, y, z) per on passarà la via en un bucle tancat
        const controlPoints = [
            new THREE.Vector3(0, 12, -20),   // Cim inicial (alta energia potencial)
            new THREE.Vector3(15, 0, -10),   // Baixada i gir
            new THREE.Vector3(20, -5, 10),   // Punt baix
            new THREE.Vector3(0, -2, 20),    // Inici del canvi de rasant
            new THREE.Vector3(-20, 8, 10),   // Segon turó 
            new THREE.Vector3(-10, -5, -10)  // Retorn al punt d'inici
        ];

        
        const trackCurve = new THREE.CatmullRomCurve3(controlPoints, true);

        // Generem la geometria de la via (un tub en 3D al voltant de la corba)
        const tubeGeometry = new THREE.TubeGeometry(trackCurve, 100, 0.3, 8, true);
        const tubeMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x64748b, 
            roughness: 0.3,
            metalness: 0.8 
        });
        const trackMesh = new THREE.Mesh(tubeGeometry, tubeMaterial);
        scene.add(trackMesh);

        // 4. EL VAGÓ
        // Creem un petit cub que farà la funció de vagó de la muntanya russa
        const cartGeometry = new THREE.BoxGeometry(1.5, 1, 2);
        const cartMaterial = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.2 });
        const cart = new THREE.Mesh(cartGeometry, cartMaterial);
        scene.add(cart);

        // 5. CICLES I FÍSICA DE LA SIMULACIÓ
        let t = 0; // Paràmetre de posició al llarg de la corba [0, 1]
        const gravity = 9.81;
        const maxAltitude = 12; // L'alçada del punt més alt (primer controlPoint)

        // rellotge i la longitud total de la via en metres
        const clock = new THREE.Clock();
        const trackLength = trackCurve.getLength();

        const speedText = document.getElementById("velocitat");
        const altText = document.getElementById("alcada");

        function animate() {
            requestAnimationFrame(animate);

            const deltaTime = clock.getDelta(); 

            // Obtenim la posició actual del vagó per saber la seva alçada (y)
            const currentPosition = trackCurve.getPointAt(t);
            const y = currentPosition.y;

            //Conservació de l'energia
            const speed = Math.sqrt(2 * gravity * (maxAltitude - y) + 2);

            // Actualitzem les dades de la interfície d'usuari
            speedText.innerText = `Velocitat: ${(speed * 3.6).toFixed(1)} km/h`;
            altText.innerText = `Alçada: ${y.toFixed(1)} m`;

            // Increment del paràmetre t mitjançant la fórmula exacta t = (v * dt) / L
            t += (speed * deltaTime) / trackLength;
            if (t > 1) t = 0; // Si arriba al final del recorregut, torna a començar

            // Actualitzem la posició del vagó
            cart.position.copy(currentPosition);

            // ORIENTACIÓ VECTORIAL (Frenet-Serret modificat)
            // vector tangent 
            const tangent = trackCurve.getTangentAt(t).normalize();

            const lookTarget = currentPosition.clone().add(tangent);
            cart.lookAt(lookTarget);
            controls.update();
            renderer.render(scene, camera);
        }

        // Ajustar la pantalla dinàmicament si l'usuari canvia la mida de la finestra
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Iniciem la simulació
        animate();
    </script>
</body>
</html>
